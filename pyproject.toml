[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eden-repository-harvester"
version = "0.1.0"
description = "Eden Repository Harvester"
requires-python = ">=3.9"

dependencies = [
    "connexion[uvicorn,flask,swagger-ui]",
    "rdflib==7.5.0",
    "lxml==6.0.2",
    "requests>=2.30.0",
    "six",
    "python-dateutil",
    "jmespath",
    "SPARQLWrapper",
    "jsonschema",
    "eden-service-validator @ git+https://github.com/EOSC-EDEN/wp2-service-validator.git@v0.1.0",
]

[project.scripts]
eden-harvester = "repo_harvester_server.app:main"

[tool.setuptools.packages.find]
include = ["repo_harvester_server*"]

# None of these are Python modules, so setuptools ships none of them unless we
# say so - and every one of them is opened at runtime. Omitting them produces a
# package that imports cleanly and then fails on the first request.
[tool.setuptools.package-data]
"repo_harvester_server" = ["swagger/*.yaml", "data/*.json", "xslt/*.xslt", "*.csv"]
"repo_harvester_server.demo" = ["templates/*.html", "static/*"]
