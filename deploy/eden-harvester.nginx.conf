# nginx site file for the harvester demo on the EDEN entry VM (eden-infra
# docs/entry-vm.md, Part B). nginx there terminates TLS and proxies over
# eden-net to the harvester VM, which has no public address.
#
# Replace 192.168.0.x with the harvester VM's private IP, then:
#
#   sudo cp eden-harvester.nginx.conf /etc/nginx/sites-available/harvester
#   sudo ln -sf /etc/nginx/sites-available/harvester /etc/nginx/sites-enabled/harvester
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot --nginx then adds TLS to this server block and the 80 -> 443 redirect.

# Must equal UVICORN_HOST and UVICORN_PORT in /etc/eden-harvester.env on the
# harvester VM.
upstream harvester_backend {
    server 192.168.0.x:8000;
}

# One harvest is a burst of slow outbound requests. Rate-limit per client so a
# single visitor cannot occupy every slot the application has. The zone lives
# in the entry VM's shared http context, hence the harvester_ prefix.
limit_req_zone $binary_remote_addr zone=harvester_harvest:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name eden-harvester.vm.fedcloud.eu;

    access_log /var/log/nginx/harvester.access.log;
    error_log  /var/log/nginx/harvester.error.log;

    # Inherited by every location below, none of which sets its own.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A generous estimate, not measured. Single calls time out after 10-15s, but
    # a harvest makes a variable number of them (signposting follows up to
    # MAX_DESCRIBEDBY_LINKS links), so there is no fixed worst case.
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;

    # Every endpoint is GET; nothing legitimate sends a body.
    client_max_body_size 8k;

    # The rate limit sits on the two harvest entry points only. nginx matches the
    # path and ignores the query string, so GET /?url=... lands in "location = /"
    # and GET /api/?url=... in "location = /api/" (GET /api?url=... gets a 307 to
    # /api/ from the app, query string kept). Everything else - /logo-eden.svg,
    # /favicon.ico, the Swagger UI under /api/ui/, /api/openapi.json - goes
    # through "location /" unthrottled: one page load plus a click on the footer's
    # "JSON API" link is about ten requests in seconds, and against a burst of 5
    # half of them would get a 503.
    location = / {
        limit_req zone=harvester_harvest burst=5 nodelay;
        proxy_pass http://harvester_backend;
    }

    location = /api/ {
        limit_req zone=harvester_harvest burst=5 nodelay;
        proxy_pass http://harvester_backend;
    }

    location / {
        proxy_pass http://harvester_backend;
    }

    location = /healthz {
        proxy_pass http://harvester_backend;
        access_log off;
    }
}
