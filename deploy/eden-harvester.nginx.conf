# This file has two parts that go in two DIFFERENT places in the nginx
# config. Pasting the whole file into one place will not start nginx - see
# docs/deploy-eu-node.md for the exact steps.

# ============================================================================
# Part 1 - goes in its own file, e.g. /etc/nginx/conf.d/eden-harvester-limits.conf
#
# limit_req_zone is only valid in the "http" context, not inside a server {}
# block. The stock nginx.conf includes /etc/nginx/conf.d/*.conf at the http
# level, so dropping this in a new file there reaches the right context
# without editing nginx.conf itself.
# ============================================================================

# One harvest is a burst of slow outbound requests. Rate-limit per client so a
# single visitor cannot occupy every slot the application has.
limit_req_zone $binary_remote_addr zone=harvest:10m rate=10r/m;

# ============================================================================
# Part 2 - goes INSIDE the existing
# server { listen 443 ssl; server_name eden-harvester.vm.fedcloud.eu; } block
#
# limit_req (as opposed to limit_req_zone) is a server/location-level
# directive and references the zone defined in Part 1 by name.
# ============================================================================

location / {
    limit_req zone=harvest burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A generous estimate, not a measured figure: the harvest path's own
    # per-call timeouts (10-15s, see HarvestSession.py and the registry
    # helpers) bound a single request, but the signposting 'describedby'
    # loop has no cap on how many links a target page may publish, so the
    # true worst case for one harvest is not a fixed number. 120s is
    # comfortably above what any well-behaved target should need.
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 8k;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    access_log off;
}
