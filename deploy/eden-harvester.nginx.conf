# This file has two parts that go in two DIFFERENT places in the nginx
# config. Pasting the whole file into one place will not start nginx - see
# docs/deploy-eu-node.md for the exact steps.

# ============================================================================
# Part 1 - goes in its own file, e.g. /etc/nginx/conf.d/eden-harvester-limits.conf
#
# limit_req_zone is only valid in the "http" context, not inside a server {}
# block. The stock nginx.conf includes /etc/nginx/conf.d/*.conf at the http
# level, so dropping this in a new file there reaches the right context
# without editing nginx.conf itself.
# ============================================================================

# One harvest is a burst of slow outbound requests. Rate-limit per client so a
# single visitor cannot occupy every slot the application has.
limit_req_zone $binary_remote_addr zone=harvest:10m rate=10r/m;

# ============================================================================
# Part 2 - REPLACES the existing "location /" INSIDE the TLS server block
# ( server { listen 443 ssl; server_name eden-harvester.vm.fedcloud.eu; } in
# /etc/nginx/sites-enabled/default - Ubuntu's default site, which
# certbot --nginx extended with "listen 443 ssl" rather than replacing, so it
# already carries its own location / with root /var/www/html;). Check first:
#
#     grep -n "location /" /etc/nginx/sites-enabled/default
#
# nginx rejects two location / blocks in the same server{} with
# 'duplicate location "/"', so paste the four locations below OVER the
# existing one, not alongside it - see docs/deploy-eu-node.md for the exact
# steps. root /var/www/html; in that block becomes dead code once / proxies
# elsewhere; harmless to leave, but delete it too.
#
# limit_req (as opposed to limit_req_zone) is a server/location-level
# directive and references the zone defined in Part 1 by name.
#
# Split into two exact-match harvest entry points and one prefix match for
# everything else, so the rate limit only ever throttles the harvest itself.
# nginx matches locations on the path and ignores the query string, so GET
# /?url=... still matches "location = /" and GET /api/?url=... still matches
# "location = /api/" below (GET /api?url=..., without the trailing slash,
# gets a 307 from the Starlette mount whose redirect carries the query
# string, so the retried request also lands on "location = /api/"). Without
# this split, a single page load (which pulls /logo-eden.svg and
# /favicon.ico) plus one click on the footer's "JSON API" link (which pulls
# /api/ui/, its assets, and /api/openapi.json) makes roughly ten requests in
# seconds against a burst of 5 - about half would get a 503, and the demo
# would look broken to exactly the audience it is shown to.
# ============================================================================

location = / {
    limit_req zone=harvest burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A generous estimate, not a measured figure: the harvest path's own
    # per-call timeouts (10-15s, see HarvestSession.py and the registry
    # helpers) bound a single request, but the signposting 'describedby'
    # loop follows at most MAX_DESCRIBEDBY_LINKS links (RepositoryHarvester.py)
    # rather than a fixed total wait, so the true worst case for one harvest
    # is not a single fixed number. 120s is comfortably above what any
    # well-behaved target should need.
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 8k;
}

location = /api/ {
    limit_req zone=harvest burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 8k;
}

location / {
    # What actually goes through here: static assets (/logo-eden.svg,
    # /favicon.ico), the Swagger UI at /api/ui/, and its spec at
    # /api/openapi.json. The two harvest entry points, / and /api/, are
    # rate-limited by their own exact-match blocks above - no rate limit
    # is needed here.
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 8k;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    access_log off;
}
